<!-- கட்டுரை சமர்ப்பிப்புப் பகுதி -->
<section style="background: #ffffff; padding: 40px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 800px; margin: 40px auto;">
    
    <div style="text-align: center; margin-bottom: 25px;">
        <span style="color: #800000; font-weight: bold; font-size: 0.9rem;">கட்டுரை சமர்ப்பிப்பு</span>
        <h2 style="color: #222; font-size: 1.8rem; margin: 5px 0;">உங்கள் ஆய்வுக் கட்டுரையை அனுப்புங்கள்</h2>
        <p style="color: #666; font-size: 0.95rem;">படிவத்தை நிரப்பி சமர்ப்பிக்கவும். ஆசிரியர் குழு 4-6 வாரங்களுக்குள் தொடர்பு கொள்ளும்.</p>
    </div>

    <form onsubmit="submitToEmail(event)" style="display: flex; flex-direction: column; gap: 18px;">
        
        <!-- வரிசை 1 -->
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 250px;">
                <label style="display: block; font-weight: 600; margin-bottom: 5px;">ஆசிரியர் பெயர் *</label>
                <input type="text" id="author_name" required placeholder="உங்கள் முழு பெயர்" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div style="flex: 1; min-width: 250px;">
                <label style="display: block; font-weight: 600; margin-bottom: 5px;">நிறுவனம் / கல்லூரி</label>
                <input type="text" id="institution" placeholder="பல்கலைக்கழகம் / கல்லூரி" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
        </div>

        <!-- வரிசை 2 -->
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 250px;">
                <label style="display: block; font-weight: 600; margin-bottom: 5px;">மின்னஞ்சல் *</label>
                <input type="email" id="email" required placeholder="your@email.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div style="flex: 1; min-width: 250px;">
                <label style="display: block; font-weight: 600; margin-bottom: 5px;">தொலைபேசி எண்</label>
                <input type="tel" id="phone" placeholder="+91 XXXXX XXXXX" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
        </div>

        <!-- வரிசை 3 -->
        <div>
            <label style="display: block; font-weight: 600; margin-bottom: 5px;">கட்டுரை தலைப்பு *</label>
            <input type="text" id="paper_title" required placeholder="உங்கள் கட்டுரையின் தலைப்பை தமிழில் எழுதவும்" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
        </div>

        <!-- வரிசை 4 -->
        <div>
            <label style="display: block; font-weight: 600; margin-bottom: 5px;">சுருக்கம் (Abstract)</label>
            <textarea id="abstract" rows="4" placeholder="கட்டுரையின் சுருக்கமான விளக்கம் (150 வார்த்தைகள் வரை)..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;"></textarea>
        </div>

        <!-- பொத்தான் -->
        <button type="submit" style="background-color: #800000; color: #ffffff; padding: 12px 25px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px;">
            <i class="fas fa-paper-plane"></i> கட்டுரை சமர்ப்பிக்க
        </button>

    </form>
</section>

<!-- JavaScript Script -->
<script>
function submitToEmail(event) {
    event.preventDefault(); // படிவம் இயல்பாக Submit ஆவதைத் தடுக்கிறது

    // படிவத்திலிருந்து தரவுகளை எடுத்தல்
    var name = document.getElementById('author_name').value;
    var inst = document.getElementById('institution').value;
    var email = document.getElementById('email').value;
    var phone = document.getElementById('phone').value;
    var title = document.getElementById('paper_title').value;
    var abstract = document.getElementById('abstract').value;

    // மின்னஞ்சல் தலைப்பு மற்றும் உள்ளடக்கத்தை உருவாக்குதல்
    var mailtoAddress = "drbharathisivasankari01@gmail.com";
    var subject = encodeURIComponent("புதிய ஆய்வுக் கட்டுரை சமர்ப்பிப்பு - " + title);
    
    var bodyText = "மௌவல் ஓசை ஆய்விதழ் - புதிய கட்டுரை சமர்ப்பிப்பு:\n\n" +
                   "-------------------------------------------\n" +
                   "ஆசிரியர் பெயர்: " + name + "\n" +
                   "நிறுவனம் / கல்லூரி: " + inst + "\n" +
                   "மின்னஞ்சல்: " + email + "\n" +
                   "தொலைபேசி எண்: " + phone + "\n\n" +
                   "கட்டுரை தலைப்பு: " + title + "\n\n" +
                   "சுருக்கம் (Abstract):\n" + abstract + "\n" +
                   "-------------------------------------------";

    // Gmail/Email செயலியைத் திறக்க வைத்தல்
    window.location.href = "mailto:" + mailtoAddress + "?subject=" + subject + "&body=" + encodeURIComponent(bodyText);
}
</script>
